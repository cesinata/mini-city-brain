name: mcb
version: "0.2.0"
config-version: 2
profile: mcb

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Share of 96 intervals a detector-day must have for the completeness test to pass.
  min_completeness: 0.9
  # Share of detector-days that may be below min_completeness before the test fails (D45).
  max_incomplete_share: 0.01
  # Share of raw rows that may repeat an earlier key before the duplicate-rate test fails.
  max_duplicate_rate: 0.01
  # Time zone for local hour-of-day, weekday and day (decision D43: the real files follow
  # Melbourne wall-clock time, daylight saving included).
  local_time_zone: "Australia/Melbourne"

models:
  mcb:
    +materialized: table
