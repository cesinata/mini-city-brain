<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">mini-city-brain architecture</title>
  <desc id="d">A replay client posts readings to a FastAPI service, which publishes valid readings to a queue on a local AWS emulator. A worker reads the queue and writes newline-delimited JSON files to a raw bucket; messages that fail three times go to a dead-letter queue. A Dagster job loads the files into DuckDB, runs the dbt models and tests, and stops on bad data. A baseline forecast API and the static page read the models. Prometheus and Grafana collect metrics from the API and the worker.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <style>
      .b { fill:#eef4fb; stroke:#2b5d9b; stroke-width:1.5; }
      .q { fill:#fff5e5; stroke:#a05a00; stroke-width:1.5; }
      .d { fill:#fdeceb; stroke:#a8322b; stroke-width:1.5; }
      .o { fill:#eef7ee; stroke:#2f7d32; stroke-width:1.5; }
      .frame { fill:#f7f8fa; stroke:#6b7785; stroke-width:1.2; stroke-dasharray:6 4; }
      text { font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill:#1b1f23; text-anchor:middle; }
      .s { font-size: 12px; fill:#555; }
      .h { font-size: 14px; font-weight:600; text-anchor:start; }
      .hs { font-size: 12px; fill:#555; text-anchor:start; }
      .l { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#a); }
      .both { marker-start:url(#a); }
      .dash { stroke-dasharray:5 4; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- Metrics: one wide box above the services it watches -->
  <rect class="b" x="210" y="20" width="530" height="48" rx="6"/>
  <text x="475" y="41">Prometheus + Grafana</text>
  <text class="s" x="475" y="58">metrics from the API and the worker</text>

  <!-- Ingestion row -->
  <rect class="b" x="20" y="110" width="150" height="60" rx="6"/>
  <text x="95" y="135">Replay client</text><text class="s" x="95" y="154">synthetic or SCATS file</text>
  <rect class="b" x="210" y="110" width="150" height="60" rx="6"/>
  <text x="285" y="135">FastAPI</text><text class="s" x="285" y="154">validates readings</text>
  <rect class="q" x="400" y="110" width="150" height="60" rx="6"/>
  <text x="475" y="135">Ingest queue</text><text class="s" x="475" y="154">local AWS emulator</text>
  <rect class="b" x="590" y="110" width="150" height="60" rx="6"/>
  <text x="665" y="135">Worker</text><text class="s" x="665" y="154">batches, then writes</text>
  <rect class="o" x="780" y="110" width="150" height="60" rx="6"/>
  <text x="855" y="135">Raw bucket</text><text class="s" x="855" y="154">ndjson by date</text>

  <path class="l" d="M170,140 H208"/>
  <path class="l" d="M360,140 H398"/>
  <path class="l" d="M550,140 H588"/>
  <path class="l" d="M740,140 H778"/>

  <!-- Metrics scrape: straight up -->
  <path class="l dash" d="M285,110 V70"/>
  <path class="l dash" d="M665,110 V70"/>

  <!-- Dead-letter queue: straight down from the queue -->
  <rect class="d" x="400" y="225" width="150" height="60" rx="6"/>
  <text x="475" y="250">Dead-letter queue</text><text class="s" x="475" y="269">after 3 failed receives</text>
  <path class="l dash" d="M475,170 V223"/>

  <!-- Dagster job frame around load, DuckDB and dbt -->
  <rect class="frame" x="575" y="205" width="370" height="250" rx="10"/>
  <text class="h" x="592" y="230">Dagster job</text>
  <text class="hs" x="592" y="248">load, dbt build, blocking checks</text>

  <rect class="b" x="780" y="262" width="150" height="60" rx="6"/>
  <text x="855" y="287">Loader</text><text class="s" x="855" y="306">manifest, idempotent</text>
  <rect class="o" x="780" y="375" width="150" height="60" rx="6"/>
  <text x="855" y="400">DuckDB</text><text class="s" x="855" y="419">raw tables + models</text>
  <rect class="b" x="590" y="375" width="150" height="60" rx="6"/>
  <text x="665" y="400">dbt models + tests</text><text class="s" x="665" y="419">staging and marts</text>

  <path class="l" d="M855,170 V260"/>
  <path class="l" d="M855,322 V373"/>
  <path class="l both" d="M742,405 H778"/>

  <!-- Readers of the models -->
  <rect class="b" x="780" y="485" width="150" height="60" rx="6"/>
  <text x="855" y="510">Baseline forecast</text><text class="s" x="855" y="529">API and static page</text>
  <path class="l" d="M855,435 V483"/>
</svg>
